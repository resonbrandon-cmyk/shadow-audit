- name: OpenAI API key
  regex: '\bsk-[A-Za-z0-9_-]{16,}\b'
- name: AWS access key
  regex: '\bAKIA[0-9A-Z]{16}\b'
- name: GitHub token
  regex: '\bgh[pousr]_[A-Za-z0-9_]{20,}\b'
- name: Google API key
  regex: '\bAIza[0-9A-Za-z_-]{20,}\b'
- name: Slack token
  regex: '\bxox[baprs]-[0-9A-Za-z-]{20,}\b'
- name: Stripe secret key
  regex: '\bsk_live_[0-9A-Za-z]{16,}\b'
- name: Bearer token
  regex: '(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{20,}'
